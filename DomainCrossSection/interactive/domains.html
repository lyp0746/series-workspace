.hint{font-size:12px;color:#888}

</style></head><body>

"信任", "swap": "N", "swapnote": "信任升为主瓶颈时动作加「绕开（政府背书/强制险）」，Q3 不变", "q2": "拆分,预计算,复制,试探", "q3": "B", "q3core": "风险因子+赔付率+安全边际，三列可写", "q4": "被判断者", "presence": "分散", "gaveup": "个体公平（风险池以个体定价换可保性）", "basis": "规范文本", "grade": "B", "refs": "[37][38]", "q2l": "['拆分', '预计算', '复制', '试探']"}, {"id": "D19", "domain": "教材编写", "q1a": "注意力", "q1b": "协调", "swap": "N", "swapnote": "协调升为主瓶颈时动作加「拆分（模块对齐课时）」，Q3 不变", "q2": "拆分,预计算,抽象,复制", "q3": "B", "q3core": "知识图谱+难度梯度+练习设计，图谱可写，梯度靠判断", "q4": "下游", "presence": "延迟", "gaveup": "学科完整前沿（教材以覆盖面换可学性）", "basis": "公开统计", "grade": "B", "refs": "[39][40]", "q2l": "['拆分', '预计算', '抽象', '复制']"}, {"id": "D20", "domain": "城市应急管理", "q1a": "延迟", "q1b": "协调", "swap": "Y", "swapnote": "若以「协调」为主瓶颈，动作从「拆分（预案分级）」转为「抽象（统一指挥与信息共享）」，Q3 由 B 降 C：跨部门协同写不出十行", "q2": "拆分,复制,预计算,试探", "q3": "B", "q3core": "事件分级+响应流程+资源调度，分级可写，协同不可写", "q4": "不在场者", "presence": "延迟", "gaveup": "预案的完备性（分级以覆盖面换响应速度）", "basis": "规范文本", "grade": "B", "refs": "[41][42]", "q2l": "['拆分', '复制', '预计算', '试探']"}], "cols": {"filters": ["q1a", "q3", "presence", "grade"], "search": ["domain", "q2", "q3core", "gaveup", "q4"], "table": ["id", "domain", "q1a", "q3", "presence"], "detail": ["q1b", "q2", "q3core", "q4", "gaveup", "swap", "swapnote", "basis", "grade", "refs"]}, "conf": {"slug": "domains"}};
const ROWS = DATA.rows, COLS = DATA.cols, CONF = DATA.conf;
const state = {q: "", sel: null, f: {}};
COLS.filters.forEach(k => state.f[k] = "");

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function init(){
  document.getElementById("thead").innerHTML = "<tr>" + COLS.table.map(c=>`<th>${esc(c)}</th>`).join("") + "</tr>";
  const bar = document.getElementById("bar");
  COLS.filters.forEach(k=>{
    const vals = [...new Set(ROWS.map(r=>r[k]).filter(v=>v!=null && v!==""))].sort();
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">${esc(k)}：全部</option>` + vals.map(v=>`<option>${esc(v)}</option>`).join("");
    sel.onchange = e => { state.f[k] = e.target.value; render(); };
    bar.appendChild(sel);
  });
  const q = document.createElement("input");
  q.type = "search"; q.placeholder = "搜索：" + COLS.search.join(" / ");
  q.oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
  bar.appendChild(q);
}

function filtered(){
  const q = state.q;
  return ROWS.filter(r =>
    COLS.filters.every(k => !state.f[k] || r[k] === state.f[k]) &&
    (!q || COLS.search.some(k => String(r[k]||"").toLowerCase().includes(q))));
}

function render(){
  const f = filtered();
  document.getElementById("cards").innerHTML = [
    ["当前条数", f.length],
    ["总计", ROWS.length]
  ].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  const tb = document.getElementById("tbody");
  if (!f.length){ tb.innerHTML = `<tr><td colspan="${COLS.table.length}"><div class="empty">没有符合条件的记录。</div></td></tr>`; return; }
  tb.innerHTML = f.map((r,i)=>`<tr data-i="${ROWS.indexOf(r)}" class="${ROWS.indexOf(r)===state.sel?"sel":""}">` +
    COLS.table.map(c=>`<td>${esc(r[c])}</td>`).join("") + "</tr>").join("");
  [...tb.querySelectorAll("tr")].forEach(tr=>tr.onclick=()=>show(+tr.dataset.i));
}

function show(i){
  state.sel = i; const r = ROWS[i];
  document.getElementById("detail").innerHTML =
    `<h2>${esc(r[COLS.table[0]])}</h2>` +
    COLS.detail.map(k=>`<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(r[k])}</div></div>`).join("");
  render();
}

init(); render();
</script></body></html>
